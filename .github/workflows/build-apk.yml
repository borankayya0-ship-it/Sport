
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK ve komut satırı araçlarını hazırla
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Android lisanslarını kabul et ve gerekli paketleri kur
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" \
            -type f -path '*/bin/sdkmanager' 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK Command-line Tools veya sdkmanager bulunamadı."
            echo "ANDROID_HOME=${ANDROID_HOME:-tanımlı değil}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-tanımlı değil}"
            exit 1
          fi

          echo "SDK yöneticisi bulundu: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}" --licenses

          "$SDKMANAGER" --sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK paketleri hazır."
          
